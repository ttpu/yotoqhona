services:
  postgres:
    image: postgres:16
    container_name: sshe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sshe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sshe_pgdata:/var/lib/postgresql/data

volumes:
  sshe_pgdata:
